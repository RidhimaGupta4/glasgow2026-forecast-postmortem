[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgpm"
version = "1.0.0"
description = "Leakage-free post-mortem of a Glasgow 2026 Commonwealth Games medal-table forecast"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ridhima Gupta" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
